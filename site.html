<title>Thingadera</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell. Sticky top bar (platform + combination), persistent left sidebar (search + every term), main pane shows one entry with prev/next */
:root{
  --bg:#f2f4f3; --surface:#ffffff; --ink:#15201d; --muted:#5b6964; --line:#d5dcd9;
  --accent:#0d7a6c; --accent-ink:#ffffff; --accent-soft:#d7efe9; --mark:#e2e9e6; --warn:#9a5b12; --warn-soft:#f6ead9;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --bar:56px; --side:300px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1a2321; --surface:#212c29; --ink:#e6ecea; --muted:#9aa9a4; --line:#33413d;
  --accent:#6bb8a8; --accent-ink:#0f2621; --accent-soft:#24413b; --mark:#2c3936; --warn:#e3a95c; --warn-soft:#3a2c18; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#1a2321; --surface:#212c29; --ink:#e6ecea; --muted:#9aa9a4; --line:#33413d;
  --accent:#6bb8a8; --accent-ink:#0f2621; --accent-soft:#24413b; --mark:#2c3936; --warn:#e3a95c; --warn-soft:#3a2c18; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:0}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top, 0px);z-index:20;height:var(--bar);background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.brand{all:unset;cursor:pointer;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em;white-space:nowrap}
.brand small{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-left:8px;vertical-align:2px}
.spacer{flex:1}
.platpick{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.platpick select{background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:6px 28px 6px 10px;color:var(--ink);font-size:14px;cursor:pointer}
.btn{font:500 14px var(--body);border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 13px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.count{font-family:var(--mono);font-size:12px;border-radius:999px;padding:0 7px;background:var(--mark);color:var(--ink)}
.count.bad{background:var(--warn);color:var(--surface)}
.menuBtn{display:none}
.comboShort{display:none}

/* shell */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:calc(100vh - var(--bar))}
.side{position:sticky;top:calc(var(--bar) + env(safe-area-inset-top, 0px));height:calc(100vh - var(--bar) - env(safe-area-inset-top, 0px));
  border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-width:0;
  padding-left:env(safe-area-inset-left, 0px)}
.search{padding:14px 14px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.field{display:flex;align-items:center;gap:8px;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:0 6px 0 12px}
.field:focus-within{border-color:var(--accent)}
.field input{flex:1;min-width:0;border:0;background:transparent;outline:none;padding:9px 0;font-size:15px}
.field input::placeholder{color:var(--muted)}
.kbd{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.nav{flex:1;overflow-y:auto;padding:6px 8px 16px;overscroll-behavior:contain}
.nav h3{font-family:var(--mono);font-size:11.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.group{border-bottom:1px solid var(--line)}
.group summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:10px 6px;border-radius:6px}
.group summary::-webkit-details-marker{display:none}
.group summary:hover{background:var(--bg)}
.group summary .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.group summary::after{content:"";width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);margin-left:8px;transition:transform .15s}
.group[open] summary::after{transform:rotate(45deg)}
.group summary .gl{display:flex;gap:8px;align-items:baseline;flex:1}
.list{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column}
.item{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;box-sizing:border-box;padding:6px 8px;border-radius:6px;font-size:14.5px}
.item:hover{background:var(--bg)}
.item[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.item.na{color:var(--muted)}
.item.na .t{text-decoration:line-through;text-decoration-color:var(--line)}
.tag{font-family:var(--mono);font-size:10px;white-space:nowrap}
.tag.na{color:var(--warn)}
.tag.map{color:var(--accent)}
.tag.score{color:var(--muted)}
.matches{padding:8px 0 10px;border-bottom:1px solid var(--line)}
.matches h3{padding:4px 6px 6px}
.matches .none{padding:4px 8px;font-size:13.5px;color:var(--muted)}
.sidefoot{border-top:1px solid var(--line);padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.sidefoot .btn{justify-content:center}
.status{font-size:12.5px;color:var(--accent);min-height:1em}

/* main */
.main{min-width:0;padding-block:28px 64px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.page{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.crumbs{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.crumbs .where{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em}
.crumbs .where b{color:var(--accent);font-weight:500}
.pager{display:flex;gap:6px}
.pager .btn{padding:6px 10px;font-size:13px}
.said{font-size:14px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.said q{color:var(--ink);font-style:italic}
.said .alt{all:unset;cursor:pointer;border-bottom:1px solid var(--line);color:var(--ink)}
.said .alt:hover{border-color:var(--accent)}
.conf{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:1px 7px;background:var(--accent-soft);color:var(--accent)}
.conf.weak{background:var(--warn-soft);color:var(--warn)}

.entry{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:20px 24px}
.entry > *{min-width:0}
.head{display:flex;flex-direction:column;gap:4px}
.term{font-size:34px;font-weight:700;letter-spacing:-.015em;line-height:1.08}
.pos{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.def{margin:12px 0 0;font-size:16px;max-width:58ch}
.thumb{background:var(--bg);border-radius:10px;padding:10px;align-self:start}
.thumb svg{display:block;width:100%;height:auto}
.actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.block{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:16px}
.block h3{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.block h3 ~ h3{margin-top:6px}
.nots{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.nots li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline}
.nots .x{font-family:var(--mono);font-size:12px;color:var(--warn)}
.go{all:unset;cursor:pointer;font-weight:600;border-bottom:1px solid var(--line)}
.go:hover{border-color:var(--accent)}
.notice{margin:12px 0 0;font-size:14px;background:var(--warn-soft);border-radius:8px;padding:10px 12px;max-width:58ch}
.notice b{color:var(--warn)}
.note{margin:0;font-size:14.5px;max-width:65ch}
.note.warn{color:var(--warn)}
.lvl{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:1px 6px;margin-top:2px;white-space:nowrap}
.lvl.hard{background:var(--warn-soft);color:var(--warn)}
.lvl.soft{background:var(--mark);color:var(--muted)}
.fix{color:var(--muted)}
.sys input{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.snippet{font-family:var(--mono);font-size:13px;line-height:1.6;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;white-space:pre-wrap;word-break:break-word;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.related{display:flex;flex-wrap:wrap;gap:6px}
.related .go{font-weight:500;font-size:14px;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.related .go:hover{border-color:var(--accent)}

/* home */
.hero h1{font-size:clamp(32px,5vw,46px);font-weight:700;letter-spacing:-.02em;line-height:1.05}
.hero p{margin:10px 0 0;color:var(--muted);max-width:60ch;font-size:16px}
.tries{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:14px var(--body);background:var(--surface);border:1px dashed var(--line);color:var(--ink);border-radius:999px;padding:6px 13px;cursor:pointer}
.chip:hover{border-style:solid;border-color:var(--accent)}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.how div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.how b{display:block;font-family:var(--display);font-size:16px;margin-bottom:2px}
.how p{margin:0;font-size:14px;color:var(--muted)}
.miss{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:6px}
.miss p{margin:0}

/* combination */
.combo{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.combo h1{font-size:30px;letter-spacing:-.015em}
.picked{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pick{display:inline-flex;align-items:center;gap:2px;background:var(--accent-soft);border-radius:999px;padding:3px 4px 3px 4px}
.pick.na{background:var(--warn-soft)}
.pick .go{border:0;font-weight:500;font-size:14px;padding:0 4px 0 8px}
.pick .rm{all:unset;cursor:pointer;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:16px}
.pick .rm:hover{background:var(--surface);color:var(--ink)}
.linkish{all:unset;cursor:pointer;font-size:13px;color:var(--muted);text-decoration:underline;margin-left:4px}
.verdict{font-weight:600;border-radius:8px;padding:10px 14px}
.verdict.bad{background:var(--warn-soft);color:var(--warn)}
.verdict.meh{background:var(--mark)}
.verdict.ok{background:var(--accent-soft);color:var(--accent)}
.cgroup h3{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:6px}
.cgroup h3 span{background:var(--mark);border-radius:4px;padding:0 6px;color:var(--ink)}
.cgroup.hard h3{color:var(--warn)}
.cgroup ul{margin:0;padding:0 0 0 14px;border-left:3px solid var(--line);list-style:none;display:flex;flex-direction:column;gap:6px}
.cgroup.hard ul{border-color:var(--warn)}
.cgroup.plat ul{border-color:var(--warn-soft)}
.guide summary{cursor:pointer;font-weight:600}
.guide .nots{margin-top:12px}
.gh{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 0}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow .field{flex:1;min-width:200px}

/* svg tokens */
.s-bg{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.s-mt{fill:var(--mark)}
.s-ac{fill:var(--accent)}
.s-as{fill:var(--accent-soft)}
.s-dk{fill:var(--ink);opacity:.28}
.s-ln{fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.s-la{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.s-tx{fill:var(--muted);font:600 8px var(--mono)}
.s-ty{fill:var(--ink);font:700 13px var(--display)}
.s-tyb{fill:var(--ink);font:400 8.5px var(--body)}
.s-bgf{fill:var(--surface)}

.context{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px 0}
.context label{display:flex;flex-direction:column;gap:3px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:0}
.context select{width:100%;min-width:0;background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--ink);font:14px var(--body);text-transform:none;letter-spacing:0;cursor:pointer}
.context select.set{border-color:var(--accent)}
.kofi{text-decoration:none}
.cup{width:17px;height:17px;flex:none}
.context select,.pmenu summary{height:34px;box-sizing:border-box}
.themeIco{width:14px;height:14px;border-radius:50%;border:1.5px solid currentColor;background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.tag.good{color:var(--accent)}
.item.avoid .t{text-decoration:line-through;text-decoration-color:var(--line)}
.item.avoid{color:var(--muted)}
.notice.good{background:var(--accent-soft)}
.notice.good b{color:var(--accent)}
.notice.care{background:var(--mark)}
.notice.care b{color:var(--ink)}
.mcp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.mcp div{min-width:0;max-width:52ch}
.mcp b{font-family:var(--display);font-size:17px;display:block}
.mcp p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.mcp .row a{text-decoration:none}
/* gallery */
.page.wide{max-width:1120px}
.hero .tries{margin-top:14px}
.gallery{display:flex;flex-direction:column;gap:14px}
.gchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.gchip{flex:none;font:500 13.5px var(--body);background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.gchip:hover{border-color:var(--muted)}
.gchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.gtools{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.hideoff{display:flex;gap:6px;align-items:center;font-size:13.5px;cursor:pointer}
.hideoff input{accent-color:var(--accent);width:16px;height:16px}
.gsec{display:flex;flex-direction:column;gap:10px;padding-top:8px}
.gsec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.gsec-h h2{font-size:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-width:0}
.card:hover{border-color:var(--accent)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cthumb{display:block;background:var(--bg);padding:10px 12px}
.cthumb svg{display:block;width:100%;height:auto}
.cbody{display:flex;flex-direction:column;gap:4px;padding:10px 12px 12px;min-width:0}
.cname{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.2}
.cdef{font-size:13px;color:var(--muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .tag{align-self:flex-start;margin-top:2px}
.card.off{opacity:.55}
.card.off .cname{text-decoration:line-through;text-decoration-color:var(--line)}
.linkish.strong{color:var(--accent);text-decoration:none;font-weight:500;font-family:var(--mono);font-size:12px;letter-spacing:.04em;margin:0}
.crumbs .linkish{margin:0;font-family:var(--mono);font-size:12px}
.item.cards .t{color:var(--accent);font-size:13.5px}
/* about */
.about{display:flex;flex-direction:column;gap:12px;padding-top:8px}
.about h1{font-size:34px;letter-spacing:-.015em}
.about h2{font-size:21px;margin-top:14px}
.about p{margin:0;max-width:64ch;font-size:15.5px}
.about a{color:var(--accent)}
.comp{display:flex;flex-direction:column;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.crow{display:grid;grid-template-columns:170px minmax(0,1fr) minmax(0,1fr);gap:14px;padding:12px 0;border-top:1px solid var(--line);font-size:14px}
.crow:first-child{border-top:0}
.crow b{font-family:var(--display);font-size:15px}
.clbl{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.dogfood{max-width:68ch;font-size:15px}
.only{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;max-width:64ch}
@media (max-width:700px){ .crow{grid-template-columns:1fr;gap:6px} .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))} }
.made{margin:2px 0 0;font-size:12.5px;color:var(--muted);text-align:center}
.made a{color:var(--muted);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px}
.made a:hover{color:var(--accent)}
.byline{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;border-top:1px solid var(--line);padding-top:14px;margin-top:6px;font-size:14px}
.byline span{color:var(--muted)}
.byline a{color:var(--accent);text-decoration:none;font-weight:500}
.byline a:hover{text-decoration:underline}
/* tools: deslop + wizard */
.tool{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.tool h1{font-size:30px;letter-spacing:-.015em}
.tool textarea{width:100%;font:15px/1.55 var(--body);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;resize:vertical}
.tool textarea:focus{border-color:var(--accent);outline:none}
#dsOut{display:flex;flex-direction:column;gap:12px}
.marked{font-size:15px;line-height:1.7;background:var(--bg);border-radius:10px;padding:12px 14px;white-space:pre-wrap}
.marked mark{background:var(--warn-soft);color:var(--warn);border-radius:3px;padding:0 2px;font-weight:600}
.vlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.vlist li{display:flex;flex-direction:column;gap:6px;border-left:3px solid var(--warn-soft);padding-left:12px}
.vopts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.vopt{font:13.5px var(--body);background:var(--surface);color:var(--ink);border:1.5px dashed var(--line);border-radius:8px;padding:5px 10px;cursor:pointer;text-align:left}
.vopt:hover{border-style:solid;border-color:var(--accent)}
.vopt[aria-pressed="true"]{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}

/* ---------- matching */
const norm = s => s.toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9+\-× ]+/g,' ').replace(/\s+/g,' ').trim();
const stem = w => w.replace(/(ing|ed|es|s)$/,'') || w;
const words = s => norm(s).split(' ').filter(w=>w && !STOP.has(w)).map(stem);
function score(q){
  const nq=' '+norm(q)+' ', qw=new Set(words(q)), nqt=norm(q);
  return TERMS.map(t=>{
    let s=0; const hay=[t.term,...t.aka];
    hay.forEach(h=>{ const nh=norm(h); if(nq.includes(' '+nh+' ')) s+=8; else if(nqt.length>=3 && nh.startsWith(nqt)) s+=6; });
    t.cues.forEach(c=>{
      const nc=norm(c);
      if(nq.includes(nc)) s+=2+nc.split(' ').length*1.5;
      else{ const cw=words(c), hit=cw.filter(w=>qw.has(w)).length; if(cw.length && hit===cw.length) s+=1.5+hit; else s+=hit*0.6; }
    });
    words(hay.join(' ')).forEach(w=>{ if(qw.has(w)) s+=1.5; });
    return {t,s};
  }).filter(r=>r.s>1.2).sort((a,b)=>b.s-a.s);
}

function copy(text,statusId,msg){
  const st=$(statusId);
  const done=()=>{ st.textContent=msg; setTimeout(()=>{st.textContent=''},2000) };
  const fallback=()=>{ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); let ok=false; try{ok=document.execCommand('copy')}catch(e){} ta.remove(); st.textContent= ok?msg:'Copy was blocked. Select the text and copy it.'; };
  try{ navigator.clipboard.writeText(text).then(done,fallback) }catch(e){ fallback() }
}
function snippetFor(t){
  const sys=(sysNames[t.id]||'').trim(), p=PLAT();
  const cp=contextPrompt(), uf=useFor(t);
  let s=(cp? cp+'\n' : '') + t.prompt;
  if(t.build) s+=`\nHow to build it: ${t.build}`;
  if(t.warn) s+=`\nCaution: ${t.warn}`;
  if(sys) s+=`\nIn our design system this component is called "${sys}". Use that component, not a custom one.`;
  if(t.not.length) s+=`\nNot to be confused with: ${t.not.map(n=>n[1].toLowerCase()).join(', ')}.`;
  const cl=clashesFor(t.id).filter(c=>c.lvl==='hard');
  if(cl.length) s+=`\nDon’t combine with: ${cl.map(c=>BY_ID[c.other].term.toLowerCase()+' ('+c.fix.replace(/\.$/,'').toLowerCase()+')').join('; ')}.`;
  const na=naFor(t); if(na) s+=`\nNote: ${na}`;
  nativeNotes(t).forEach(([p,r])=>{ s+=`\nOn ${p.label}: ${r}`; });
  if(uf && uf.lvl!=='good') s+=`\n${uf.lvl==='avoid'?'Avoid for':'Careful for'} ${USE().label.toLowerCase()}: ${uf.why}`;
  return s;
}
function exportMd(){
  const p=PLAT();
  let md='# UI vocabulary\n\nUse these exact terms. When a request describes one of these patterns, build that pattern as defined here. Before combining patterns, check the "Doesn’t combine with" lines.\n';
  if(p.prompt) md+=`\n**Platform:** ${p.prompt} Patterns marked "Not for this platform" should not be suggested; follow the "On <platform>" notes for native differences.\n`;
  if(USE().prompt) md+=`\n**Used for:** ${USE().prompt} Follow the "Good fit", "Careful", and "Avoid" notes.\n`;
  CATS.forEach(c=>{
    md+=`\n## ${c}\n`;
    TERMS.filter(t=>t.cat===c).forEach(t=>{
      md+=`\n### ${t.term}${t.aka.length?` (also: ${t.aka.join(', ')})`:''}\n${t.def}\n`;
      if(naFor(t)) md+=`- Not for this platform: ${naFor(t)}\n`;
      nativeNotes(t).forEach(([pp,r])=>{ md+=`- On ${pp.label}: ${r}\n`; });
      const uf=useFor(t); if(uf) md+=`- ${uf.lvl==='good'?'Good fit':uf.lvl==='care'?'Careful':'Avoid'} for ${USE().label.toLowerCase()}: ${uf.why}\n`;
      if(sysNames[t.id]) md+=`- Our component: **${sysNames[t.id]}**\n`;
      if(t.slop) md+=`- Why AI defaults to it: ${t.slop.why}\n- Ask for instead: ${t.slop.instead}\n`;
      if(t.build) md+=`- How to build: ${t.build}\n`;
      if(t.warn) md+=`- Caution: ${t.warn}\n`;
      if(t.not.length) md+=`- Not: ${t.not.map(n=>`${n[1]} (${n[2]})`).join('; ')}\n`;
      const cl=clashesFor(t.id);
      if(cl.length) md+=`- Doesn’t combine with: ${cl.map(x=>`${BY_ID[x.other].term} [${x.lvl}] ${x.why} ${x.fix}`).join(' | ')}\n`;
    });
  });
  return md;
}

      ${ctxSet?`<label class="hideoff"><input type="checkbox" id="hideOff" ${hideOff?'checked':''}> Hide ruled-out patterns</label>`:''}
    </div>`;
  let body;
  if(!list.length) body=`<div class="miss"><strong>Nothing matches${q?` “${esc(q)}”`:''}${cat?` in ${esc(cat)}`:''}.</strong><p class="hint">Try other words or another group.</p></div>`;

  return chips+tools+body;
}

function comboReport(){
  const set=new Set(combo), pairs=CLASHES.filter(c=>set.has(c[0])&&set.has(c[1]));
  return {hard:pairs.filter(c=>c[2]==='hard'), soft:pairs.filter(c=>c[2]==='soft'),
    plat:combo.map(id=>BY_ID[id]).filter(t=>naFor(t)), warns:combo.map(id=>BY_ID[id]).filter(t=>t.warn),
    uAvoid:combo.map(id=>BY_ID[id]).filter(t=>(useFor(t)||{}).lvl==='avoid'), uCare:combo.map(id=>BY_ID[id]).filter(t=>(useFor(t)||{}).lvl==='care')};
}
function comboRules(){
  const {hard,soft,plat,warns,uAvoid,uCare}=comboReport(), p=PLAT(), cp=contextPrompt();
  let s=(cp?cp+'\n':'')+`Use these patterns: ${combo.map(id=>BY_ID[id].term).join(', ')}.`;
  hard.forEach(c=>s+=`\nDon’t combine ${BY_ID[c[0]].term} and ${BY_ID[c[1]].term}: ${c[3]} ${c[4]}`);
  soft.forEach(c=>s+=`\nBe careful combining ${BY_ID[c[0]].term} and ${BY_ID[c[1]].term}: ${c[3]} ${c[4]}`);
  plat.forEach(t=>s+=`\n${t.term} doesn’t fit ${p.label}: ${naFor(t)}`);
  uAvoid.forEach(t=>s+=`\nAvoid ${t.term} for ${USE().label.toLowerCase()}: ${useFor(t).why}`);
  uCare.forEach(t=>s+=`\nCareful with ${t.term} for ${USE().label.toLowerCase()}: ${useFor(t).why}`);
  warns.forEach(t=>s+=`\n${t.term}: ${t.warn}`);
  return s;
}
const pairHtml = c => `<button class="go" type="button" data-panel="${c[0]}">${esc(BY_ID[c[0]].term)}</button> + <button class="go" type="button" data-panel="${c[1]}">${esc(BY_ID[c[1]].term)}</button>`;
function renderCombo(){
  const {hard,soft,plat,warns,uAvoid,uCare}=comboReport();
  const sec=(cls,title,items)=>items.length?`<div class="cgroup ${cls}"><h3>${title}<span>${items.length}</span></h3><ul>${items.join('')}</ul></div>`:'';
  const clean=!hard.length&&!soft.length&&!plat.length&&!uAvoid.length;
  const guideRow=c=>`<li><span class="lvl ${c[2]}">${c[2]==='hard'?'Breaks':'Clashes'}</span><span>${pairHtml(c)} ${esc(c[3])} <span class="fix">${esc(c[4])}</span></span></li>`;
  $('main').innerHTML=`<div class="page"><section class="combo">
    <button type="button" class="linkish backlink" id="comboBack">← Back to ${esc(routeLabel(prevRoute))}</button>
    <div>
      <h1>Check a combination</h1>

    </div>
    <form class="addrow" id="comboForm" autocomplete="off">
      <label class="field"><span class="sr">Add a term</span><input id="comboIn" type="text" list="termList" placeholder="Type a term, e.g. glassmorphism"></label>

    <div class="picked">${combo.length? combo.map(id=>`<span class="pick ${naFor(BY_ID[id])||(useFor(BY_ID[id])||{}).lvl==='avoid'?'na':''}"><button class="go" type="button" data-panel="${id}">${esc(BY_ID[id].term)}</button><button class="rm" type="button" data-rm="${id}" aria-label="Remove ${esc(BY_ID[id].term)}">×</button></span>`).join('')+`<button type="button" class="linkish" id="clearCombo">Clear all</button>` : '<span class="hint">Nothing added yet.</span>'}</div>
    ${combo.length<2? `<p class="hint">Add at least two terms to check how they work together. <button type="button" class="linkish" id="comboExample">Try an example</button></p>` : `
      <div class="verdict ${hard.length?'bad':clean?'ok':'meh'}">${hard.length?`${hard.length} combination${hard.length>1?'s':''} will break. Fix ${hard.length>1?'these':'this'} first.`:clean?'No known conflicts between these.':'Nothing breaks, but some choices pull against each other.'}</div>
      ${sec('hard','Breaks',hard.map(c=>`<li>${pairHtml(c)}: ${esc(c[3])} <span class="fix">Fix: ${esc(c[4])}</span></li>`))}
      ${sec('soft','Clashes',soft.map(c=>`<li>${pairHtml(c)}: ${esc(c[3])} <span class="fix">${esc(c[4])}</span></li>`))}
      ${sec('plat',`Doesn’t fit ${esc(PLAT().label)}`,plat.map(t=>`<li><button class="go" type="button" data-panel="${t.id}">${esc(t.term)}</button> ${esc(naFor(t))}</li>`))}
      ${sec('plat',`Avoid for ${esc(USE().label.toLowerCase())}`,uAvoid.map(t=>`<li><button class="go" type="button" data-panel="${t.id}">${esc(t.term)}</button> ${esc(useFor(t).why)}</li>`))}
      ${sec('cau',`Careful for ${esc(USE().label.toLowerCase())}`,uCare.map(t=>`<li><button class="go" type="button" data-panel="${t.id}">${esc(t.term)}</button> ${esc(useFor(t).why)}</li>`))}
      ${sec('cau','Use with care',warns.map(t=>`<li><button class="go" type="button" data-panel="${t.id}">${esc(t.term)}</button> ${esc(t.warn)}</li>`))}
      <div class="block"><div class="row"><button class="btn primary" type="button" id="copyRules">Copy rules for your prompt</button><span class="status" id="rulesStatus"></span></div>
      <details class="peek"><summary>See the rules</summary><pre class="snippet">${esc(comboRules())}</pre></details></div>`}
    <details class="guide">
      <summary>All known conflicts (${CLASHES.length} pairs)</summary>
      <ul class="nots">${[...CLASHES].sort((a,b)=>a[2]===b[2]?0:a[2]==='hard'?-1:1).map(guideRow).join('')}</ul>
      <h3 class="gh">Single-pattern cautions</h3>
      <ul class="nots">${TERMS.filter(t=>t.warn).map(t=>`<li><span class="lvl soft">Care</span><span><button class="go" type="button" data-panel="${t.id}">${esc(t.term)}</button> ${esc(t.warn)}</span></li>`).join('')}</ul>
    </details>
  </section></div>`;
  $('comboBack').addEventListener('click',leaveTool);
  const ex=$('comboExample'); if(ex) ex.addEventListener('click',()=>{ COMBO_EXAMPLE.forEach(id=>addCombo(id)); renderCombo(); });
  const cr=$('copyRules'); if(cr) cr.addEventListener('click',()=>copy(comboRules(),'rulesStatus','Copied'));
  $('comboForm').addEventListener('submit',e=>{ e.preventDefault(); const t=findTerm($('comboIn').value); if(t){ addCombo(t.id); renderCombo(); $('comboIn').focus(); } });
}
function findTerm(v){
  const n=norm(v); if(!n) return null;
  return TERMS.find(t=>norm(t.term)===n || t.aka.some(a=>norm(a)===n)) || (score(v)[0]||{}).t || null;
}
function addCombo(id){ if(!combo.includes(id)){ combo.push(id); saveCombo(); updateComboCount(); } }
function updateComboCount(){
  const el=$('comboCount'); el.textContent=combo.length;
  el.classList.toggle('bad', comboReport().hard.length>0);
  el.title = comboReport().hard.length ? 'Your combination has conflicts that break' : '';
}

let openGroups=new Set();
function buildNav(){
  const q=$('q').value.trim();
  let html='';
  if(q){
    const r=score(q).slice(0,6);
    html+=`<div class="matches"><h3>Matches</h3>${r.length?`<ul class="list">${r.map((x,i)=>item(x.t, i===0?'best':'')).join('')}</ul>`:`${(()=>{ clearTimeout(window._mt); window._mt=setTimeout(()=>logMiss(q,'sidebar'),1800); return ''; })()}<p class="none">No match yet. Try other words, or browse below.</p>`}</div>`;
  }
  html+=CATS.map(c=>{
    const ts=TERMS.filter(t=>t.cat===c), naN=ts.filter(t=>naFor(t)||(useFor(t)||{}).lvl==='avoid').length;
    return `<details class="group" data-cat="${esc(c)}" ${openGroups.has(c)?'open':''}><summary><span class="gl"><h3>${esc(c)}</h3></span><span class="n">${(()=>{ const ip=ts.filter(t=>inPromptSet().has(t.id)).length; return ip?`<span class="npr" title="${ip} in your prompt">\u2713 ${ip}</span>`:''; })()}${naN?`${ts.length-naN} of ${ts.length} fit`:ts.length}</span></summary><ul class="list"><li><button class="item cards" type="button" data-route="${catSlug(c)}"><span class="t">See all as cards</span></button></li>${ts.map(t=>item(t)).join('')}</ul></details>`;
  }).join('');
  $('nav').innerHTML=html;
  $('nav').querySelectorAll('details.group').forEach(d=>d.addEventListener('toggle',()=>{ d.open?openGroups.add(d.dataset.cat):openGroups.delete(d.dataset.cat) }));
  markNav();
}
function item(t,flag){
  const na=naFor(t), u=useFor(t);
  const tag = flag==='best' ? '<span class="tag score">best match</span>'
    : t.slop ? '<span class="tag na">AI default</span>'
    : na ? `<span class="tag na">not for ${esc(PLAT().label.toLowerCase())}</span>`
    : nativeNotes(t).length ? '<span class="tag score">varies by platform</span>'
    : u&&u.lvl==='avoid' ? '<span class="tag na">avoid</span>'
    : u&&u.lvl==='good' ? '<span class="tag good">good fit</span>'
    : u&&u.lvl==='care' ? '<span class="tag score">care</span>'
    : sysNames[t.id] ? '<span class="tag map">mapped</span>' : '';
  const inp=inPromptSet().has(t.id);
  return `<li><button class="item ${na?'na':''} ${u&&u.lvl==='avoid'?'avoid':''} ${inp?'inp':''}" type="button" data-go="${t.id}"><span class="t">${inp?'<span class="inpck" aria-hidden="true">\u2713</span>':''}${esc(t.term)}${inp?'<span class="sr"> (in your prompt)</span>':''}</span>${tag}</button></li>`;
}
function markNav(){
  const r=route(), t=BY_ID[r];
  if(t && !openGroups.has(t.cat)){ openGroups.add(t.cat); const d=[...$('nav').querySelectorAll('details.group')].find(x=>x.dataset.cat===t.cat); if(d) d.open=true; }
  let cur=null;
  $('nav').querySelectorAll('.item').forEach(b=>{ const on=b.dataset.go===r && !b.closest('.matches'); b.setAttribute('aria-current', on?'page':'false'); if(on) cur=b; });
  if(cur){ const nav=$('nav'), top=cur.offsetTop-nav.offsetTop; if(top<nav.scrollTop || top>nav.scrollTop+nav.clientHeight-40) nav.scrollTop=top-nav.clientHeight/3; }
}

function lookup(q){
  q=q.trim(); if(!q) return;
  if(/chingadera|thingadera/.test(norm(q))){ lookupCtx=null; go('about'); return; }
  const r=score(q);
  if(!r.length){ lookupCtx=null; logMiss(q); $('main').innerHTML=`<div class="page"><div class="miss"><strong>No term matched “${esc(q)}” yet.</strong><p class="hint">This prototype knows ${TERMS.length} terms. Try other words, or browse the sidebar.</p>${B44.on?`<form class="suggest" data-q="${esc(q)}"><label for="sgIn">Know what it’s called? <span class="hint">optional</span></label><div class="row"><input id="sgIn" type="text" placeholder="The term, if you know it"><button class="btn primary" type="submit">Suggest this term</button></div><span class="status" aria-live="polite"></span></form>`:''}${!B44.on&&FORM_URL?`<div class="row"><a class="btn primary" href="${esc(FORM_URL+(FORM_URL.includes('?')?'&':'?')+'query='+encodeURIComponent(q))}" target="_blank" rel="noopener">Suggest this term</a></div>`:''}</div></div>`; closeSide(); return; }
  const top=r[0];
  lookupCtx={id:top.t.id, said:q, weak: top.s<5 || (r[1] && r[1].s>top.s*0.85), alts:r.slice(1,4).filter(x=>x.s>top.s*0.4).map(x=>x.t)};
  if(lookupCtx.weak) logMiss(q,'weak match: '+top.t.id); else track('lookup',top.t.id);
  go(top.t.id);
}

/* Base44 backend: anonymous counts, misses, and signups. Off everywhere except the hosted site. */
const B44={app:'6aec090fdf8849fdf23e191e', on:/base44\.app$|thingadera/i.test(location.hostname)};
const SID=(()=>{ try{ let v=localStorage.getItem('say-it-right:sid'); if(!v){ v=Math.random().toString(36).slice(2,12); localStorage.setItem('say-it-right:sid',v); } return v; }catch(e){ return 'nostore'; } })();
function b44post(entity, rec){ if(!B44.on) return Promise.resolve(false);
  return fetch(`/api/apps/${B44.app}/entities/${entity}`,{method:'POST',keepalive:true,headers:{'X-App-Id':B44.app,'Content-Type':'application/json'},body:JSON.stringify({...rec,session:SID})}).then(r=>r.ok).catch(()=>false); }
const tracked=new Set();
function track(name, detail='', once=false){ const k=name+':'+detail; if(once && tracked.has(k)) return; tracked.add(k); b44post('Event',{name, route:(location.hash||'#').slice(1,60), detail:String(detail).slice(0,120)}); }
function logMiss(q, note=''){ q=(q||'').trim(); if(q.length<3) return; const k='miss:'+q.toLowerCase(); if(tracked.has(k)) return; tracked.add(k); b44post('Miss',{query:q.slice(0,200), kind:'search', note, platform:plats.join(','), use_case:useCase}); }

    if(panel.preview){
      swap=`<div class="dswap"><p class="rc-note">Previewing <b>${esc(t.term)}</b> in place of ${esc(base.term)}.</p>
        <div class="row"><button type="button" class="btn primary sm" data-puse="${t.id}">Use ${esc(t.term)}</button><button type="button" class="btn sm" data-pback="1">Keep ${esc(base.term)}</button></div></div>`;
    } else {
      const alts=swapAlternatives(base.id, briefResult().good);
      swap=`<div class="dswap">${alts.length?`<span class="rc-lbl">Swap for</span><div class="rc-alts">${alts.map(a=>`<button type="button" class="rc-alt" data-ppreview="${a}">${esc(BY_ID[a].term)}</button>`).join('')}</div>`:'<span class="rc-lbl">In your brief</span>'}
        ${detailsHtml(base.id)}
        <div class="row"><button type="button" class="linkish" data-premove="${base.id}" style="margin:0">Remove from brief</button></div></div>`;
    }
  }
  $('dpos').textContent = (L.length>1 && i>=0 ? `${i+1} of ${L.length}` : t.cat) + (panel.mode==='brief'&&i>=0?' in your prompt':'');
  $('dlive').textContent = `${t.term}${L.length>1&&i>=0?`, ${i+1} of ${L.length}`:''}`;
  $('dprev').disabled = !(i>0) || !!panel.stack.length; $('dnext').disabled = !(i>=0 && i<L.length-1) || !!panel.stack.length;
  $('dbody').innerHTML=`${back}
    <div class="head"><h2 class="dterm" id="dtitle" tabindex="-1">${esc(t.term)}</h2>${t.aka.length?`<div class="pos">also: ${t.aka.map(esc).join(', ')}</div>`:''}</div>
    <p class="def" style="margin:0">${esc(t.def)}</p>
    ${LIVE[t.id]?`<div class="dlive" id="dlivebox"><span class="lv-lbl">Try it</span><div id="dliveroot">${LIVE[t.id].html(detVals(t.id, detCtx(t.id)?null:null))}</div></div>`:`<div class="dthumb" id="dthumb">${svg(t)}<button type="button" class="dpause" id="dpause" aria-pressed="false">Pause animation</button></div>`}
    ${swap}
    ${na?`<p class="notice" style="margin:0"><b>Not a fit for ${esc(PLAT().label)}.</b> ${esc(na)}</p>`:''}
    ${u?`<p class="notice ${u.lvl==='avoid'?'':u.lvl}" style="margin:0"><b>${{good:'Good fit for',care:'Use with care for',avoid:'Avoid for'}[u.lvl]} ${esc(USE().label.toLowerCase())}.</b> ${esc(u.why)}</p>`:''}
    <div class="row"><button class="btn primary sm" type="button" id="pCopy">Copy prompt line</button><button class="btn sm" type="button" data-add="${t.id}">${inPromptSet().has(t.id)?'✓ In your prompt':'+ Add to prompt'}</button><span class="status" id="pStatus"></span></div>
    ${t.slop?`<div class="block"><h3>Why AI defaults to it</h3><p class="note">${esc(t.slop.why)}</p><h3>Ask for this instead</h3><p class="note">${esc(t.slop.instead)}</p></div>`:''}
    ${t.not.length?`<div class="block"><h3>Not to be confused with</h3><ul class="nots">${t.not.map(([id,name,why])=>`<li><span class="x">≠</span><span>${BY_ID[id]?`<button class="go" type="button" data-panel="${id}">${esc(name)}</button>`:`<strong>${esc(name)}</strong>`} ${esc(why)}</span></li>`).join('')}</ul></div>`:''}
    ${cl.length?`<div class="block"><h3>Doesn’t work well with</h3><ul class="nots">${cl.map(c=>`<li><span class="lvl ${c.lvl}">${c.lvl==='hard'?'Breaks':'Clashes'}</span><span><button class="go" type="button" data-panel="${c.other}">${esc(BY_ID[c.other].term)}</button> ${esc(c.why)}</span></li>`).join('')}</ul></div>`:''}
    ${t.build||t.warn?`<div class="block">${t.build?`<h3>How to build it</h3><p class="note">${esc(t.build)}</p>`:''}${t.warn?`<h3>Use with care</h3><p class="note warn">${esc(t.warn)}</p>`:''}</div>`:''}
    ${overHtml(t)}
    <div class="block peekblock"><details class="peek"><summary>See the prompt line</summary><pre class="snippet">${esc(snippetFor(t))}</pre></details></div>
    <button type="button" class="linkish dfull" data-gofull="${t.id}">Open full page</button>`;
  $('dbody').scrollTop=0;
  $('pCopy').addEventListener('click',()=>copy(snippetFor(t),'pStatus','Copied'));
  if(LIVE[t.id]) LIVE[t.id].wire($('dliveroot'), detVals(t.id));
  const pz=$('dpause'); if(pz){ const hasAnim=!!$('dthumb').querySelector('[class*="a-"]'); pz.hidden=!hasAnim;
  pz.addEventListener('click',()=>{ const on=$('dthumb').classList.toggle('paused'); pz.setAttribute('aria-pressed',on); pz.textContent=on?'Play animation':'Pause animation'; }); }
}
const playIO = ('IntersectionObserver' in window) ? new IntersectionObserver(es=>es.forEach(e=>{ e.target.classList.toggle('play', e.isIntersecting && e.intersectionRatio>=.6); }),{threshold:[0,.6]}) : null;
function wirePlay(){ if(!playIO) return; playIO.disconnect(); const touch=matchMedia('(hover:none)').matches;
  document.querySelectorAll(touch ? '#main .rc-main, #main .card[data-panel]' : '#main .rc-main').forEach(el=>{ if(el.querySelector('[class*="a-"],[class*="b-"]')) playIO.observe(el); }); }
let wireT; new MutationObserver(()=>{ clearTimeout(wireT); wireT=setTimeout(wirePlay,60); }).observe(document.getElementById('main'),{childList:true,subtree:true});
function overHtml(t){ const o=OVER[t.id]; if(!o) return '';
  return `<div class="block"><h3>Overdoing it</h3><p class="note"><b>Sign:</b> ${esc(o.sign)} ${esc(o.why)}</p>${o.instead.length?`<h3>Reach for something else</h3><ul class="nots">${o.instead.map(([id,when])=>`<li><span class="x">→</span><span>${BY_ID[id]?`<button class="go" type="button" data-panel="${id}">${esc(BY_ID[id].term)}</button>`:''} ${esc(when)}</span></li>`).join('')}</ul>`:''}</div>`; }
function rerenderBrief(){ const y=window.scrollY; renderBrief(); window.scrollTo({top:y}); markOpenCards(); }
document.addEventListener('click',e=>{
  const d=e.target.closest('#dpanel');
  if(e.target.closest('#dclose')||e.target.closest('#dscrim')){ closePanel(); return; }
  if(e.target.closest('#dprev')){ panelStep(-1); return; }
  if(e.target.closest('#dnext')){ panelStep(1); return; }
  const pv=e.target.closest('[data-ppreview]'); if(pv){ panel.preview=pv.dataset.ppreview; renderPanel(); const u=document.querySelector('[data-puse]'); if(u) u.focus({preventScroll:true}); return; }
  const dcx=e.target.closest('[data-dcx]'); if(dcx){ const id=dcx.dataset.dtid; detCtxSel[id]=dcx.dataset.dcx; const sc=$('dbody').scrollTop; renderPanel(); $('dbody').scrollTop=sc; const f=document.querySelector(`[data-dcx="${dcx.dataset.dcx}"]`); if(f) f.focus({preventScroll:true}); return; }
  const dt=e.target.closest('[data-dtk]'); if(dt){ const id=dt.dataset.dtid, k=dt.dataset.dtk, v=dt.dataset.dtv, c=dt.dataset.dtc; brief.details[id]=brief.details[id]||{}; const tgt=c?(brief.details[id][c]=brief.details[id][c]||{}):brief.details[id]; if(tgt[k]===v) delete tgt[k]; else tgt[k]=v; saveBrief(); track('detail_set', `${id}.${k}=${v}`);
    const sc=$('dbody').scrollTop; renderPanel(); $('dbody').scrollTop=sc; const f=document.querySelector(`[data-dtid="${id}"][data-dtk="${k}"][data-dtv="${v}"]`); if(f) f.focus({preventScroll:true}); $('dlive').textContent=detailText(id)?`${BY_ID[id].term}: ${detailText(id)}`:`${BY_ID[id].term}: no details set`; rerenderBrief(); return; }
  if(e.target.closest('[data-pback]')){ panel.preview=null; renderPanel(); focusTitle(); return; }
  if(e.target.closest('[data-pstack]')){ panel.id=panel.stack.pop(); panel.preview=null; panel.openerSel=selFor(panel.id); renderPanel(); markOpenCards(); focusTitle(); return; }
  const pu=e.target.closest('[data-puse]'); if(pu){ const from=panel.id, to=pu.dataset.puse; const k=Object.keys(brief.swaps).find(k=>brief.swaps[k]===from)||from; brief.swaps[k]=to; brief.sel=to; swapFlash=to; saveBrief();
    panel.id=to; panel.preview=null; panel.stack=[]; panel.list=briefResult().good; panel.openerSel=`[data-pick="${to}"]`; rerenderBrief(); renderPanel(); focusTitle(); return; }
  const pr=e.target.closest('[data-premove]'); if(pr){ const gone=pr.dataset.premove, L=panel.list, i=L.indexOf(gone); brief.removed.push(gone); saveBrief(); closePanel(true); rerenderBrief();
    const nextId=L[i+1]||L[i-1]; const el=nextId && document.querySelector(`[data-pick="${nextId}"]`); (el||$('main')).focus({preventScroll:true}); return; }
  const gf=e.target.closest('[data-gofull]'); if(gf){ const id=gf.dataset.gofull; if(panel.mode==='brief'){ fromBrief=true; briefReturn={y:window.scrollY}; } closePanel(true); go(id); return; }
  const pl=e.target.closest('[data-panel]'); if(pl){ e.stopPropagation();
    const id=pl.dataset.panel;
    if(d){ panel.stack.push(panel.id); panel.preview=null; panel.id=id; if(document.querySelector(selFor(id))) panel.openerSel=selFor(id); renderPanel(); markOpenCards(); focusTitle(); return; }
    const list=[...document.querySelectorAll('#main .card[data-panel]')].map(b=>b.dataset.panel);
    openPanel(id,{mode:'browse', list, openerSel:`#main .card[data-panel="${id}"]`}); return; }
}, true);

/* ---------- global clicks and keys */
document.addEventListener('click',e=>{
  const rt=e.target.closest('[data-route]'); if(rt){ go(rt.dataset.route); return; }
  const g=e.target.closest('[data-go]');
  if(g){ if(g.closest('.brief-res, .wq')){ fromBrief=true; briefReturn={y:window.scrollY}; } if(!g.closest('.matches') && !g.classList.contains('alt')) { /* keep lookup context only for matches & alts */ if(!lookupCtx || lookupCtx.id!==g.dataset.go) lookupCtx=null; } go(g.dataset.go); return; }
  const tr=e.target.closest('[data-try]'); if(tr){ $('q').value=tr.dataset.try; buildNav(); lookup(tr.dataset.try); return; }
  const a=e.target.closest('[data-add]'); if(a){ togglePrompt(a.dataset.add); return; }
  const rm=e.target.closest('[data-rm]'); if(rm){ combo=combo.filter(x=>x!==rm.dataset.rm); saveCombo(); updateComboCount(); renderCombo(); return; }
  if(e.target.id==='clearCombo'){ combo=[]; saveCombo(); updateComboCount(); renderCombo(); return; }
  if(e.target.closest('[data-home]')){ lookupCtx=null; go(''); return; }
});
$('aboutBtn').addEventListener('click',()=>{ if(route()==='about') leaveTool(); else go('about'); });
$('comboBtn').addEventListener('click',()=>{ if(route()==='combination') leaveTool(); else go('combination'); });
document.addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(e.key==='/' && !typing){ e.preventDefault(); openSide(); $('q').focus(); $('q').select(); }
  if(e.key==='Escape' && panelOpen()){ closePanel(); return; }
  if(e.key==='Tab' && panelOpen() && isPhone()){ const f=[...$('dpanel').querySelectorAll('button:not([disabled]):not([hidden]),[href],input,summary,[tabindex="-1"]#dtitle')].filter(x=>x.offsetParent!==null); if(f.length){ const first=f[0], last=f[f.length-1]; if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); } else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); } } }
  if(e.key==='F6' && panelOpen() && !isPhone()){ e.preventDefault(); if($('dpanel').contains(document.activeElement)){ const el=panel.openerSel&&document.querySelector(panel.openerSel); (el||$('main')).focus({preventScroll:true}); } else focusTitle(); return; }
  if(panelOpen() && !typing && (e.key==='ArrowLeft'||e.key==='ArrowRight')){ e.preventDefault(); panelStep(e.key==='ArrowRight'?1:-1); return; }
  if(e.key==='Escape'){ if($('side').classList.contains('open')) closeSide(); else if(document.activeElement===$('q')){ $('q').value=''; buildNav(); $('q').blur(); } }
  if(!typing && (e.key==='ArrowLeft'||e.key==='ArrowRight')){
    const t=BY_ID[route()]; if(!t) return;
    const n=TERMS[TERMS.indexOf(t)+(e.key==='ArrowRight'?1:-1)]; if(n){ lookupCtx=null; go(n.id); }
  }
});

/* ---------- mobile drawer */
function openSide(){ if(matchMedia('(max-width:860px)').matches){ $('side').classList.add('open'); $('scrim').classList.add('open'); $('menuBtn').setAttribute('aria-expanded','true'); } }
function closeSide(){ $('side').classList.remove('open'); $('scrim').classList.remove('open'); $('menuBtn').setAttribute('aria-expanded','false'); }
$('menuBtn').addEventListener('click',()=>{ $('side').classList.contains('open')?closeSide():(openSide(),$('q').focus()); });
$('scrim').addEventListener('click',closeSide);

document.addEventListener('click',e=>{ if(e.target.closest('#exportBtn')) copy(exportMd(),'exportStatus','Copied as Markdown'); });

/* ---------- start */
platNote(); updateComboCount(); buildNav(); renderMain();
</script>
